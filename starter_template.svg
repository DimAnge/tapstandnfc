<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <!-- Starter logo for the TapStand panel customizer.
       Edit the text lines (any text editor, or Inkscape), or replace everything with your own artwork.
       Keep shapes dark on a light or transparent background, keep lines at least 12 units thick,
       and keep the width, height and viewBox attributes. -->

  <!-- Symbol: a tap button with contactless waves -->
  <g fill="none" stroke="#000" stroke-width="18" stroke-linecap="round">
    <circle cx="170" cy="170" r="130"/>
    <path d="M 133.7 170.8 A 50 50 0 0 1 174.2 211.3"/>
    <path d="M 140.6 131.4 A 90 90 0 0 1 213.6 204.4"/>
    <path d="M 147.6 92 A 130 130 0 0 1 253 197.4"/>
  </g>
  <circle cx="125" cy="220" r="20" fill="#000"/>

  <!-- Name, tagline and your own line -->
  <g fill="#000" font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <text x="340" y="185" font-size="150">TapStand</text>
    <text x="346" y="285" font-size="80" letter-spacing="6">NFC stand</text>
    <rect x="40" y="335" width="1120" height="14" rx="7"/>
    <text x="600" y="442" font-size="88" text-anchor="middle">Insert your own text</text>
  </g>
</svg>
